
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis-ai-assistant.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract JARVIS project
        run: |
          test -f jarvis-ai-assistant.zip || {
            echo "ERROR: jarvis-ai-assistant.zip not found in repository root"
            exit 1
          }

          mkdir extracted
          unzip -q jarvis-ai-assistant.zip -d extracted

          PACKAGE_FILE=$(find extracted \
            -name package.json \
            -not -path "*/node_modules/*" \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          mkdir app
          cp -a "$PROJECT_DIR/." app/

      - name: Install project dependencies
        working-directory: app
        run: npm install

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Configure Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init JARVIS com.primebazaar.jarvis --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
